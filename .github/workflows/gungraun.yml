name: Gungraun

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full base commit SHA (available in kdy1/lynx)
        required: true
      head_ref:
        description: Full head commit SHA (available in kdy1/lynx)
        required: true
      suite:
        description: Workload suite (native includes layout, styling and runtime)
        type: string
        default: native
      cases:
        description: Comma-separated case IDs (empty runs the complete suite)
        default: ""
      dhat:
        description: Also collect allocation profiles with DHAT
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/gungraun.yml
      - testing/gungraun/**
      - testing/telemetry/**

permissions:
  contents: read

concurrency:
  group: gungraun-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'kdy1/lynx'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ runner.temp }}/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preserve the common harness outside the measured checkout
        run: |
          cp -R testing/gungraun "$RUNNER_TEMP/harness"
          cp -R testing/telemetry "$RUNNER_TEMP/harness/telemetry"
      - name: Restore native compiler cache
        if: inputs.suite != 'vector'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gungraun-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gungraun-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang valgrind libglib2.0-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
          python3 -m pip install --break-system-packages -r tools/vpython_tools/requirements.txt
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          cargo install --locked gungraun-runner --version 0.20.0
      - name: Test comparison validation
        run: python3 -m unittest discover -s "$RUNNER_TEMP/harness" -p 'test_*.py'
      - name: Compare exact revisions
        env:
          SUITE: ${{ inputs.suite || 'native' }}
          CASES: ${{ inputs.cases }}
          LYNX_DHAT: ${{ inputs.dhat || 'false' }}
          BASE_SHA: ${{ inputs.base_ref || github.sha }}
          HEAD_SHA: ${{ inputs.head_ref || github.sha }}
        run: python3 "$RUNNER_TEMP/harness/compare.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/results"
      - name: Save native compiler cache, including failed builds
        if: always() && inputs.suite != 'vector'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gungraun-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain summaries and raw profiles
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gungraun-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
